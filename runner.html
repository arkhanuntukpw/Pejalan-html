<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratinjau Kode HTML Online</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f5f5f5; }

  header {
    background: #007bff;
    color: white;
    text-align: center;
    padding: 20px 10px;
    font-size: 20px;
    font-weight: bold;
  }

  .container {
    max-width: 700px;
    margin: 20px auto;
    padding: 15px;
  }

  textarea {
    width: 100%;
    height: 400px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
    resize: vertical;
  }
  textarea::placeholder { color: #aaa; }

  .buttons {
    text-align: center;
    margin-top: 15px;
  }
  button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
  }

  .btn-preview { background: #e7f1ff; color: #007bff; border: 1px solid #007bff; }
  .btn-sample { background: #f1f1f1; color: #555; border: 1px solid #ccc; }
  .btn-reset { background: #ffe7e7; color: #e74c3c; border: 1px solid #e74c3c; }

  iframe {
    width: 100%;
    height: 400px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-top: 20px;
    background: white;
  }
</style>
</head>
<body>

<header>
  Pratinjau Kode HTML Online
</header>

<div class="container">
  <textarea id="htmlCode" placeholder="Silakan tempelkan kode HTML..."></textarea>
  
  <div class="buttons">
    <button class="btn-preview" onclick="pratinjau()">Pratinjau HTML</button>
    <button class="btn-sample" onclick="muatContoh()">Muat Contoh</button>
    <button class="btn-reset" onclick="aturUlang()">Atur Ulang</button>
  </div>

  <iframe id="preview"></iframe>
</div>

<script>
  function pratinjau() {
    const code = document.getElementById('htmlCode').value;
    const preview = document.getElementById('preview').contentWindow.document;
    preview.open();
    preview.write(code);
    preview.close();
  }

  function muatContoh() {
    document.getElementById('htmlCode').value = 
`<h1 style="color:blue; text-align:center;">Halo Dunia!</h1>
<p>Ini contoh pratinjau HTML online.</p>
<button onclick="alert('Kamu klik aku!')">Klik Saya</button>`;
    pratinjau();
  }

  function aturUlang() {
    document.getElementById('htmlCode').value = '';
    document.getElementById('preview').src = 'about:blank';
  }
</script>

</body>
</html>
